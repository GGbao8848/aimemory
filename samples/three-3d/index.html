<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>aimemory · 3D 星系（Three.js 样例）</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #04060c; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: #dfe8f8; }
  canvas { display: block; }
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; align-items: center; gap: 14px; padding: 12px 18px;
    background: linear-gradient(180deg, rgba(4,8,16,.85), rgba(4,8,16,0));
    font-size: 13px;
  }
  header b { font-size: 15px; }
  .badge { padding: 3px 10px; border-radius: 999px; font-size: 11px; border: 1px solid rgba(125,211,252,.45); color: #7dd3fc; }
  .badge.demo { border-color: rgba(251,191,36,.5); color: #fbbf24; }
  header a { margin-left: auto; color: #8fb6e8; font-size: 12px; }
  #legend {
    position: fixed; left: 16px; top: 60px; z-index: 10; width: 210px;
    background: rgba(10,16,30,.6); border: 1px solid rgba(140,175,230,.16);
    border-radius: 12px; padding: 12px 14px; font-size: 12px; backdrop-filter: blur(10px);
  }
  #legend h3 { margin: 0 0 8px; font-size: 11px; letter-spacing: .18em; color: #7d8fb0; font-weight: 600; }
  #legend .row { display: flex; align-items: center; gap: 8px; padding: 3px 0; color: #b9c7de; }
  #legend .dot { width: 8px; height: 8px; border-radius: 50%; }
  #legend .n { margin-left: auto; font-variant-numeric: tabular-nums; color: #eaf2ff; }
  #tip {
    position: fixed; z-index: 20; pointer-events: none; max-width: 260px;
    background: rgba(12,20,36,.92); border: 1px solid rgba(125,211,252,.4);
    border-radius: 8px; padding: 8px 10px; font-size: 12px; line-height: 1.5;
  }
  #tip b { color: #9fd6ff; }
  #tip .sub { color: #93a5c2; font-size: 11px; }
  #hint { position: fixed; right: 16px; bottom: 14px; z-index: 10; color: #5f7396; font-size: 11px; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<header>
  <b>aimemory · 3D 星系</b>
  <span class="badge" id="badge">连接中…</span>
  <span style="color:#7d8fb0">Three.js r160 · 样例（对比用）</span>
  <a href="/">← 返回星图</a>
</header>
<aside id="legend"><h3>记忆层级</h3></aside>
<div id="tip" hidden></div>
<div id="hint">拖拽旋转 · 滚轮缩放 · 悬停看节点</div>
<script type="module" src="./main.js"></script>
</body>
</html>
