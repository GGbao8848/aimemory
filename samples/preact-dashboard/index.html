<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>aimemory · 控制台（Preact + htm 样例）</title>
<style>
  :root { color-scheme: dark; --line: rgba(140,175,230,.14); --mut: #8ba0c0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #070b13; color: #dfe8f8;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; display: flex; gap: 12px; align-items: center;
    padding: 12px 22px; background: rgba(7,11,19,.9); border-bottom: 1px solid var(--line); font-size: 13px; }
  .badge { padding: 3px 10px; border-radius: 999px; font-size: 11px; border: 1px solid rgba(125,211,252,.45); color: #7dd3fc; }
  .badge.demo { border-color: rgba(251,191,36,.5); color: #fbbf24; }
  header a { margin-left: auto; color: #8fb6e8; font-size: 12px; }
  main { max-width: 1180px; margin: 0 auto; padding: 20px 22px 60px; display: grid; gap: 16px;
    grid-template-columns: repeat(12, 1fr); }
  .card { grid-column: span 3; background: rgba(13,20,36,.7); border: 1px solid var(--line);
    border-radius: 12px; padding: 14px 16px; }
  .card.w6 { grid-column: span 6; } .card.w12 { grid-column: span 12; }
  .k { font-size: 11px; letter-spacing: .16em; color: var(--mut); }
  .v { font-size: 26px; font-variant-numeric: tabular-nums; margin-top: 6px; }
  .v small { font-size: 12px; color: var(--mut); margin-left: 4px; }
  h3 { margin: 0 0 10px; font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--mut); font-weight: 500; }
  td.mono { font-family: ui-monospace, monospace; font-size: 11px; color: #a8bdd9; }
  .op { padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; }
  .op.ADD { background: rgba(94,234,212,.15); color: #5eead4; }
  .op.UPDATE { background: rgba(96,165,250,.15); color: #60a5fa; }
  .op.DELETE { background: rgba(248,113,113,.15); color: #f87171; }
  .op.NOOP { background: rgba(148,163,184,.15); color: #94a3b8; }
  .bar { height: 7px; border-radius: 4px; background: rgba(120,170,255,.1); overflow: hidden; margin-top: 8px; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, #38bdf8, #5eead4); }
  .entry { padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 12.5px; line-height: 1.55; }
  .entry .kind { color: #7dd3fc; font-family: ui-monospace, monospace; font-size: 11px; margin-right: 8px; }
  .entry .src { color: #66799a; font-size: 11px; }
</style>
</head>
<body>
<script>
  // 自诊断：样例页把模块加载/运行错误暴露到 window.__errs，控制台与自动化验收都能读
  window.__errs = [];
  addEventListener('error', (e) => window.__errs.push((e.error && e.error.stack) || e.message));
  addEventListener('unhandledrejection', (e) => window.__errs.push('REJ: ' + ((e.reason && e.reason.stack) || e.reason)));
</script>
<header>
  <b>aimemory · 控制台</b>
  <span class="badge" id="badge">连接中…</span>
  <span style="color:#7d8fb0">Preact + htm · 样例（对比用，React 同款 Hooks API）</span>
  <a href="/">← 返回星图</a>
</header>
<div id="root"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
